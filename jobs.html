<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Jobs</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f2ef;
}

/* NAV */
.nav{
    background:#0A66C2;
    color:white;
    padding:15px 30px;
    font-size:20px;
    font-weight:bold;
}

/* container */
.container{
    width:800px;
    margin:20px auto;
}

/* search box */
.search-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

.search-box input:focus{
    outline:none;
    border:2px solid #0A66C2;
}

/* job card */
.job{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.job h3{
    margin-bottom:5px;
}

.job p{
    color:#666;
    margin-bottom:10px;
}

button{
    background:#0A66C2;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
}

button:hover{
    background:#004182;
}
</style>

</head>
<body>

<div class="nav">
    LinkedIn Clone - Jobs
</div>

<div class="container">

    <div class="search-box">
        <input type="text" placeholder="Search jobs (e.g. Frontend Developer)">
    </div>

    <div class="job">
        <h3>Software Developer</h3>
        <p>Coimbatore, India</p>
        <p>HTML, CSS, JavaScript required</p>
        <button>Apply</button>
    </div>

    <div class="job">
        <h3>Full-stack Designer</h3>
        <p>Bangalore, India</p>
        <p>Figma, Design Systems</p>
        <button>Apply</button>
    </div>

    <div class="job">
        <h3>Web Developer Intern</h3>
        <p>Remote</p>
        <p>HTML, CSS basics</p>
        <button>Apply</button>
    </div>

</div>

</body>
</html>
