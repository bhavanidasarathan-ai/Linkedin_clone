<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="register-container">

    <div class="register-card">

        <img src="images/logo.svg" alt="LinkedIn Logo" class="logo">

        <h2>Join LinkedIn</h2>

        <form id="registerForm">

            <div class="name-group">
                <input
                    id="firstName"
                    type="text"
                    placeholder="First Name"
                    required>

                <input
                    id="lastName"
                    type="text"
                    placeholder="Last Name"
                    required>
            </div>

            <input
                id="email"
                type="email"
                placeholder="Email Address"
                required>

            <div class="password-box">
                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required>

                <button type="button" onclick="togglePassword()">👁</button>
            </div>

            <div class="strength">
                <div class="strength-fill"></div>
            </div>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm Password"
                required>

            <input
                id="location"
                type="text"
                placeholder="Location">

            <label class="upload">
                Upload Profile Picture
                <input
                    id="profilePicture"
                    type="file"
                    accept="image/*">
            </label>

            <label class="terms">
                <input
                    id="terms"
                    type="checkbox"
                    required>

                I agree to the Terms & Conditions
            </label>

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}

document.getElementById("password").addEventListener("input", function () {

    const strength = document.querySelector(".strength-fill");

    if (this.value.length < 4) {
        strength.style.width = "30%";
    } else if (this.value.length < 8) {
        strength.style.width = "60%";
    } else {
        strength.style.width = "100%";
    }

});
</script>

<script src="register.js"></script>

</body>
</html>
